    // Funktion, um eine Route zur Warteschlange hinzuzufügen
    function enqueueRoute(startAddress, endAddress, routeDetails) {
        routeQueue.push({ startAddress, endAddress, routeDetails });
        processQueue(); // Starte die Verarbeitung der Warteschlange
    }

    // Funktion, um die Warteschlange zu verarbeiten
    function processQueue() {
        if (isProcessing || routeQueue.length === 0) return; // Verhindere mehrere parallele Verarbeitungen oder leere Warteschlange

        isProcessing = true;

        // Verarbeite die nächste Route in der Warteschlange mit einem Delay
        function processNext() {
            if (routeQueue.length === 0) {
                isProcessing = false; // Beende die Verarbeitung, wenn die Warteschlange leer ist
                return;
            }

            const route = routeQueue.shift(); // Nimm die erste Route aus der Warteschlange
            addRoute(route.startAddress, route.endAddress, route.routeDetails);

            // Verarbeite die nächste Route nach 100 Millisekunden (10 Routen pro Sekunde)
            setTimeout(processNext, 1000 / 5); // Passe die Verzögerung an, um nicht die Rate zu überschreiten
        }

        processNext();
    }

function updateRoutes(newRoutes) {

    const skippedRoutes = [];

    newRoutes.forEach((route, index) => {

        console.log('Route:', route);

        const uniqueIdentifier = route.ID || route.Auftragsnummer;

// Funktion zum Entfernen von Routen
function removeRoute(routeId) {
    console.log(`Versuche, Route ${routeId} zu entfernen.`);

    // Debugging: Alle aktuellen IDs in routeLayers prüfen
    const allRouteIds = routeLayers.map(layer => layer.routeDetails?.id);
    console.log('Alle gespeicherten IDs in routeLayers:', allRouteIds);

    if (!loadedRoutes[routeId]) {
        console.warn(`Route ${routeId} ist nicht in loadedRoutes.`);
    }

    const layerIndex = routeLayers.findIndex(layer => layer.routeDetails?.id === routeId);
    if (layerIndex === -1) {
        console.warn(`Route ${routeId} nicht in routeLayers gefunden. Aktueller Zustand:`, routeLayers);
        return;
    }

    console.log(`Route ${routeId} in routeLayers gefunden. Index: ${layerIndex}`);

    const layer = routeLayers[layerIndex];
    if (layer.outerLayer) {
        console.log(`Entferne äußere Linie für Route ${routeId}.`);
        layer.outerLayer.setMap(null);
    }
    if (layer.innerLayer) {
        console.log(`Entferne innere Linie für Route ${routeId}.`);
        layer.innerLayer.setMap(null);
    }
    if (layer.startMarker) {
        console.log(`Entferne Startmarker für Route ${routeId}.`);
        layer.startMarker.setMap(null);
    }
    if (layer.endMarker) {
        console.log(`Entferne Endmarker für Route ${routeId}.`);
        layer.endMarker.setMap(null);
    }

    routeLayers.splice(layerIndex, 1); // Entferne die Route aus routeLayers
    delete loadedRoutes[routeId]; // Entferne die Route aus loadedRoutes

    console.log(`Route ${routeId} erfolgreich entfernt. Neuer Zustand von routeLayers:`, routeLayers);
}

function removeRouteFromMap(routeId) {
    const routeLayer = routeLayers.find(layer => layer.routeDetails && layer.routeDetails.id === routeId);
    if (routeLayer) {
        if (routeLayer.outerLayer) routeLayer.outerLayer.setMap(null);
        if (routeLayer.innerLayer) routeLayer.innerLayer.setMap(null);
        if (routeLayer.startMarker) routeLayer.startMarker.setMap(null);
        if (routeLayer.endMarker) routeLayer.endMarker.setMap(null);
    }

    // Entferne Route aus den Layern
    routeLayers = routeLayers.filter(layer => layer.routeDetails && layer.routeDetails.id !== routeId);
    console.log(`Route ${routeId} von der Karte entfernt.`);
}


// Prüfen, ob sich eine Route geändert hat
function hasRouteChanged(existingRoute, newRoute) {
    for (let key in newRoute) {
        if (newRoute[key] !== existingRoute[key]) {
            console.log(`Feld geändert: ${key} (alt: ${existingRoute[key]}, neu: ${newRoute[key]})`);
            return true; // Sobald ein Feld anders ist, gilt die Route als geändert
        }
    }
    return false; // Alle Felder sind gleich
}


// Hilfsfunktion zum Parsen von CSV-Daten
function parseCSVToJson(csv) {
    console.log('Starte Parsing der CSV-Daten.');
    
    // Spalten-Separator und Zeilenumbruch-Logik
    const delimiter = ';';
    const rows = csv.split('\n'); // Zerlege in Zeilen

    const parsedData = [];
    let headers = [];
    let currentRow = [];
    let inQuotes = false;

    rows.forEach((line, lineIndex) => {
        const values = line.split(delimiter);

        // Verarbeite jede Zelle
        for (let value of values) {
            value = value.trim();

            if (value.startsWith('"')) {
                inQuotes = true;
                currentRow.push(value); // Starte ein neues Mehrzeilenfeld
            } else if (inQuotes) {
                currentRow[currentRow.length - 1] += '\n' + value; // Füge zur letzten Zelle hinzu
                if (value.endsWith('"')) {
                    inQuotes = false; // Beende das Mehrzeilenfeld
                }
            } else {
                currentRow.push(value); // Normale Zelle
            }
        }

        // Wenn nicht in einem Mehrzeilenfeld und die Header noch nicht festgelegt sind
        if (!inQuotes && headers.length === 0) {
            headers = currentRow.map(header => header.trim());
            console.log('Headers:', headers);
            currentRow = [];
        }

        // Wenn eine vollständige Zeile fertig ist
        if (!inQuotes && currentRow.length > 0) {
            const result = {};
            headers.forEach((header, index) => {
                result[header] = currentRow[index] || null;
            });

            // Überprüfen, ob die Zeile gültig ist (hat eine ID oder andere wesentliche Felder)
            if (result.ID && result.ID.trim() !== '') {
                parsedData.push(result);
            } else {
                console.warn(`Ungültige oder leere Zeile ignoriert (Zeile ${lineIndex + 1}):`, result);
            }


            

            currentRow = [];
        }
    });

    console.log('CSV erfolgreich geparst:', parsedData);
    return parsedData;
}

    if (typeof dateStr === 'string') {

        // Prüfen auf deutsches Format (DD.MM.YYYY)
